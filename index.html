<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zion Assembly Church member portal">
  <title>Welcome | Zion Assembly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="gate-body">
  <div class="gate-bg"></div>
  <main class="gate-shell">
    <div class="gate-card">
      <img class="gate-logo" src="assets/logo.png" alt="Church logo">
      <div class="gate-topline"><span class="live-dot"></span> ZION ASSEMBLY PORTAL</div>
      <p class="eyebrow">The Redeemed Christian Church of God</p>
      <h1 id="gate-title">Welcome to <span>Zion Assembly</span></h1>
      <p id="gate-subtitle" class="lead">Worship. Learn. Connect. Grow.</p>
      <div class="gate-divider"><span></span><i>✦</i><span></span></div>

      <section id="role-step" class="gate-step">
        <p class="step-label">YOUR PORTAL AWAITS</p><h2>Choose your entrance</h2><p class="step-subtitle">Select your role to continue.</p>
        <div class="role-grid">
          <button class="role-card" data-role="admin">
            <span class="role-icon"><span>♛</span></span>
            <strong>Admin</strong>
            <small>Manage the church portal</small><em>Enter as administrator&nbsp; →</em>
          </button>
          <button class="role-card" data-role="member">
            <span class="role-icon"><span>✦</span></span>
            <strong>Member</strong>
            <small>Access sermons and church updates</small><em>Enter as a member&nbsp; →</em>
          </button>
        </div>
      </section>

      <section id="passcode-step" class="gate-step hidden">
        <button id="back-btn" class="back-btn">← Back</button>
        <div id="role-badge" class="role-badge"></div>
        <h2 id="passcode-title">Enter passcode</h2>
        <p id="passcode-help">Enter your passcode to continue.</p>
        <form id="passcode-form">
          <label for="passcode">Passcode</label>
          <div class="password-wrap">
            <input id="passcode" type="password" autocomplete="off" required placeholder="Enter passcode">
            <button type="button" id="toggle-pass" aria-label="Show passcode">Show</button>
          </div>
          <p id="error-message" class="error-message"></p>
          <button class="btn primary full" type="submit">Continue →</button>
        </form>
      </section>

      <p class="gate-note">Zion Assembly Church Portal</p>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="gate.js"></script>
</body>
</html>
